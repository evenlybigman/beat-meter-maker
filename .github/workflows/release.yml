# 설치 파일 만들기: v로 시작하는 태그를 올리면(예: git tag v1.0.0 && git push --tags) 실행
# Windows(.exe), macOS(.dmg, Apple Silicon), Linux(.AppImage)를 만들어 GitHub 릴리스 "초안"에 올림
# → 내용을 확인한 뒤 GitHub에서 직접 "Publish"를 눌러 공개
# latest*.yml은 자동 업데이트용 (설치된 앱이 이 파일로 새 버전을 확인). Publish해야 사용자에게 전달됨
# FFmpeg가 GPL이므로 들어간 ffmpeg 버전의 소스 묶음도 함께 올림 (THIRD_PARTY_NOTICES.md 참고)
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: macos-latest
            files: release/*.dmg   # macOS는 서명이 없어 자동 업데이트 안 함
          - os: ubuntu-latest
            files: |
              release/*.AppImage
              release/latest-linux*.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - name: 설치 파일 만들기
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 코드 서명 없이 만듦 (서명 인증서가 생기면 바꾸기)
      - name: 들어간 ffmpeg 버전 기록
        shell: bash
        run: |
          FF=$(node -p "require('ffmpeg-static')")
          V=$("$FF" -version | head -1 | sed -E 's/^ffmpeg version n?([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          echo "ffmpeg $V ($RUNNER_OS)"
          echo "$V" > release/ffmpeg-version-${{ runner.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: |
            ${{ matrix.files }}
            release/ffmpeg-version-*.txt
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: ffmpeg 소스 받기 (GPL)
        run: |
          mkdir -p src
          for V in $(cat out/ffmpeg-version-*.txt | sort -u); do
            curl -fsSL -o "src/ffmpeg-$V.tar.xz" "https://ffmpeg.org/releases/ffmpeg-$V.tar.xz" || echo "::warning::ffmpeg $V 소스를 받지 못했습니다 — 직접 올려 주세요"
          done
          ls -la out src
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            out/*.exe
            out/*.exe.blockmap
            out/*.yml
            out/*.dmg
            out/*.AppImage
            src/*.tar.xz
